<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title data-i18n="title">2DMarkerTool</title>
  <meta name="theme-color" content="#0f1115" id="meta-theme" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png?v=20" />
  <link rel="icon" type="image/png" href="icon-192.png?v=20" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" />
  <link rel="stylesheet" href="style.css?v=34" />
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v11m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></symbol>
      <symbol id="i-print" viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 18H4a2 2 0 01-2-2v-4a2 2 0 012-2h16a2 2 0 012 2v4a2 2 0 01-2 2h-2M6 14h12v7H6z"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></symbol>
      <symbol id="i-console" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M13 15h4"/></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
      <symbol id="i-install" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></symbol>
      <symbol id="i-keyboard" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M8 14h8"/></symbol>
      <symbol id="i-mirror" viewBox="0 0 24 24"><path d="M12 3v18M6 8l-4 4 4 4M18 8l4 4-4 4"/></symbol>
      <symbol id="i-generate" viewBox="0 0 24 24"><path d="M10.5 3.2l1.7 5.6 5.6 1.7-5.6 1.7-1.7 5.6-1.7-5.6-5.6-1.7 5.6-1.7z"/><path d="M18 14.5l.7 2.3 2.3.7-2.3.7-.7 2.3-.7-2.3-2.3-.7 2.3-.7z"/></symbol>
      <symbol id="i-cols" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="1.5"/><path d="M12 4.5v15"/></symbol>
      <symbol id="i-rows" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="1.5"/><path d="M3.5 12h17"/></symbol>
      <symbol id="i-tabs" viewBox="0 0 24 24"><rect x="3.5" y="8" width="17" height="11.5" rx="1.5"/><path d="M7 8V5.6a1 1 0 011-1h3.4a1 1 0 011 1V8"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
      <symbol id="i-cube" viewBox="0 0 24 24"><path d="M12 2l9 5v10l-9 5-9-5V7zM3 7l9 5 9-5M12 12v10"/></symbol>
      <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 16l5-5 4 4 3-3 6 6"/><circle cx="8.5" cy="9" r="1.5"/></symbol>
      <symbol id="i-app" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2.5"/><rect x="6.5" y="6.5" width="4.5" height="4.5"/><rect x="13" y="6.5" width="4.5" height="4.5"/><rect x="6.5" y="13" width="4.5" height="4.5"/><path d="M13 13h4.5v4.5H13z"/></symbol>
      <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.7 2.6 15.3 0 18M12 3c-2.6 2.7-2.6 15.3 0 18"/></symbol>
      <symbol id="i-theme" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 010 18z" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h7M16 7h4M4 17h11M19 17h1"/><circle cx="14" cy="7" r="2.3"/><circle cx="9" cy="17" r="2.3"/></symbol>
    </defs>
  </svg>
  <header>
    <div class="header-top">
      <div class="brand">
        <span class="brand-logo">
          <img class="app-icon" src="icon-192.png?v=20" alt="2DMarkerTool" width="30" height="30" />
          <span class="status-dot" id="status-dot" title=""></span>
        </span>
        <span class="brand-text">
          <span class="brand-titlerow">
            <h1 data-i18n="title">2DMarkerTool</h1>
            <button id="about-btn" class="iconbtn icon-only about-btn" data-i18n-title="about.title"><svg class="ic"><use href="#i-info"/></svg></button>
          </span>
        </span>
      </div>
      <nav class="tabs">
        <button class="tab active" data-tab="generate" data-i18n="tab.generate">生成</button>
        <button class="tab" data-tab="scan" data-i18n="tab.scan">認識</button>
      </nav>
      <div class="header-ctrls">
        <button id="install-btn" class="iconbtn ghost-btn" hidden data-i18n-title="install">
          <svg class="ic"><use href="#i-install"/></svg></button>
        <label class="ctrl ctrl-icon" data-i18n-title="language"><svg class="ic"><use href="#i-globe"/></svg><select id="lang"></select></label>
        <label class="ctrl ctrl-icon" data-i18n-title="theme"><svg class="ic"><use href="#i-theme"/></svg>
          <select id="theme">
            <option value="system" data-i18n="theme.system">システム</option>
            <option value="light" data-i18n="theme.light">ライト</option>
            <option value="dark" data-i18n="theme.dark">ダーク</option>
            <option value="hc" data-i18n="theme.hc">ハイコントラスト</option>
          </select>
        </label>
      </div>
    </div>
  </header>

  <!-- ========== 生成タブ ========== -->
  <section id="tab-generate" class="tab-panel active">
    <details class="card cpane" data-ckey="gen-type" open>
      <summary class="cpane-head"><span data-i18n="gen.paneType">種類の設定</span></summary>
      <div class="controls">
        <label>
          <span data-i18n="gen.type">種類</span>
          <select id="gen-type">
            <option value="aruco">ArUco</option>
            <option value="apriltag">AprilTag</option>
            <option value="qr">QR</option>
            <option value="barcode" data-i18n="gen.barcode">バーコード</option>
          </select>
        </label>
        <label class="gt-aruco">
          <span data-i18n="gen.dictSize">辞書サイズ</span>
          <select id="gen-dict">
            <option value="4">4×4</option><option value="5">5×5</option>
            <option value="6">6×6</option><option value="7">7×7</option>
            <option value="aruco-orig">ORIGINAL</option>
          </select>
        </label>
        <label class="gt-aruco">
          <span data-i18n="gen.dictCount">辞書の最大数</span>
          <select id="gen-count">
            <option value="50">50</option><option value="100">100</option>
            <option value="250">250</option><option value="1000">1000</option>
          </select>
        </label>
        <label class="gt-apriltag" hidden>
          <span data-i18n="gen.family">ファミリー</span>
          <select id="gen-april">
            <option value="april-16h5">16h5</option>
            <option value="april-25h9">25h9</option>
            <option value="april-36h10">36h10</option>
            <option value="april-36h11" selected>36h11</option>
          </select>
        </label>
        <label class="gt-qr grow" hidden>
          <span data-i18n="gen.qrText">テキスト / URL</span>
          <input id="gen-qr-text" type="text" value="https://example.com" />
        </label>
        <label class="gt-qr" hidden>
          <span data-i18n="gen.qrEc">誤り訂正</span>
          <select id="gen-qr-ec"><option>L</option><option selected>M</option><option>Q</option><option>H</option></select>
        </label>
        <label class="gt-barcode" hidden>
          <span data-i18n="gen.bcFormat">形式</span>
          <select id="gen-bc-format">
            <option value="CODE128">CODE128</option>
            <option value="EAN13">EAN-13 (JAN)</option>
            <option value="EAN8">EAN-8</option>
            <option value="UPC">UPC-A</option>
            <option value="CODE39">CODE39</option>
            <option value="ITF14">ITF-14</option>
          </select>
        </label>
        <label class="gt-barcode grow" hidden>
          <span data-i18n="gen.bcText">値</span>
          <input id="gen-bc-text" type="text" value="012345678905" />
        </label>
        <label>
          <span data-i18n="gen.sizePx">サイズ (px)</span>
          <input id="gen-size" type="number" value="300" min="50" max="2000" step="10" inputmode="numeric" />
        </label>
        <label class="checkbox">
          <input id="gen-border" type="checkbox" checked />
          <span data-i18n="gen.addBorder">余白(白枠)を付ける</span>
        </label>
      </div>
    </details>

    <details class="card cpane" data-ckey="gen-single" open>
      <summary class="cpane-head"><span data-i18n="gen.single">単一マーカー</span></summary>
      <div class="generate-output">
        <div class="canvas-wrap"><canvas id="gen-canvas" width="300" height="300"></canvas></div>
        <div class="gen-side">
          <label class="inline gt-aruco gt-apriltag">
            <span data-i18n="gen.markerId">マーカー ID</span>
            <input id="gen-id" type="number" value="0" min="0" inputmode="numeric" />
          </label>
          <p id="gen-label" class="gen-label"></p>
          <p id="gen-ip" class="gen-ip"></p>
          <div class="btn-row">
            <button id="gen-btn" class="iconbtn primary" disabled data-i18n-title="gen.generate">
              <svg class="ic"><use href="#i-generate"/></svg></button>
            <button id="gen-download-png" class="iconbtn" disabled title="PNG">
              <svg class="ic"><use href="#i-download"/></svg><span>PNG</span></button>
            <button id="gen-download-svg" class="iconbtn" disabled title="SVG">
              <svg class="ic"><use href="#i-download"/></svg><span>SVG</span></button>
            <button id="gen-print" class="iconbtn" disabled data-i18n-title="gen.print">
              <svg class="ic"><use href="#i-print"/></svg></button>
          </div>
        </div>
      </div>
    </details>

    <details class="card cpane" data-ckey="gen-batch" open>
      <summary class="cpane-head"><span data-i18n="gen.batch">リストから一括生成</span></summary>
      <div class="controls">
        <label class="grow">
          <span id="gen-list-label" data-i18n="gen.idList">ID リスト</span>
          <textarea id="gen-list" rows="2">0-9</textarea>
          <small class="hint" id="gen-list-hint" data-i18n="gen.idListHint">例: 0-9, 12, 20-22</small>
        </label>
        <label>
          <span data-i18n="gen.format">ダウンロード形式</span>
          <select id="gen-batch-format"><option value="png">PNG</option><option value="svg">SVG</option></select>
        </label>
      </div>
      <div class="btn-row">
        <button id="gen-batch-btn" class="iconbtn primary" disabled data-i18n-title="gen.batchGenerate">
          <svg class="ic"><use href="#i-generate"/></svg></button>
        <button id="gen-batch-zip" class="iconbtn" disabled data-i18n-title="gen.zipDownload">
          <svg class="ic"><use href="#i-download"/></svg><span>ZIP</span></button>
        <button id="gen-batch-print" class="iconbtn" disabled data-i18n-title="gen.sheetPrint">
          <svg class="ic"><use href="#i-print"/></svg></button>
      </div>
      <p id="gen-batch-info" class="gen-label"></p>
      <div id="gen-grid" class="gen-grid"></div>
    </details>
  </section>

  <!-- ========== スキャンタブ ========== -->
  <section id="tab-scan" class="tab-panel">
    <details class="card cpane" data-ckey="scan-config" open>
      <summary class="cpane-head"><span data-i18n="scan.paneConfig">認識の設定</span></summary>
      <div class="controls">
        <label>
          <span data-i18n="scan.dictionary">認識対象</span>
          <select id="scan-dict">
            <option value="AUTO" selected data-i18n="scan.auto">全自動（全種別）</option>
            <optgroup label="ArUco 4×4"><option value="4-50">4×4 (50)</option><option value="4-100">4×4 (100)</option><option value="4-250">4×4 (250)</option><option value="4-1000">4×4 (1000)</option></optgroup>
            <optgroup label="ArUco 5×5"><option value="5-50">5×5 (50)</option><option value="5-100">5×5 (100)</option><option value="5-250">5×5 (250)</option><option value="5-1000">5×5 (1000)</option></optgroup>
            <optgroup label="ArUco 6×6"><option value="6-50">6×6 (50)</option><option value="6-100">6×6 (100)</option><option value="6-250">6×6 (250)</option><option value="6-1000">6×6 (1000)</option></optgroup>
            <optgroup label="ArUco 7×7"><option value="7-50">7×7 (50)</option><option value="7-100">7×7 (100)</option><option value="7-250">7×7 (250)</option><option value="7-1000">7×7 (1000)</option></optgroup>
            <optgroup label="ArUco"><option value="aruco-orig">ArUco ORIGINAL</option></optgroup>
            <optgroup label="AprilTag">
              <option value="april-16h5">AprilTag 16h5</option>
              <option value="april-25h9">AprilTag 25h9</option>
              <option value="april-36h10">AprilTag 36h10</option>
              <option value="april-36h11">AprilTag 36h11</option>
            </optgroup>
            <optgroup label="QR"><option value="QR" data-i18n="scan.qr">QR コード</option></optgroup>
            <optgroup label="Barcode"><option value="BARCODE" data-i18n="scan.barcode">バーコード（JAN/EAN 等）</option></optgroup>
          </select>
        </label>
        <label>
          <span data-i18n="scan.displayMode">表示モード</span>
          <select id="display-mode">
            <option value="2d" data-i18n="scan.mode2d">2D 枠</option>
            <option value="fill" data-i18n="scan.modeFill">塗りつぶし＋ID</option>
            <option value="3d" data-i18n="scan.mode3d">3D 姿勢</option>
          </select>
        </label>
        <label id="fill-mode-ctrl" hidden>
          <span data-i18n="scan.fillColor">塗り色</span>
          <select id="fill-mode">
            <option value="random" data-i18n="scan.fillRandom">ランダム（ID毎）</option>
            <option value="custom" data-i18n="scan.fillCustom">指定色</option>
          </select>
        </label>
        <label id="fill-color-ctrl" hidden><span data-i18n="scan.pickColor">色</span><input id="fill-color" type="color" value="#2dd36f" /></label>
        <label id="marker-len-ctrl" hidden>
          <span data-i18n="scan.markerLen">マーカーサイズ (mm)</span>
          <input id="marker-len" type="number" value="50" min="1" max="2000" step="1" inputmode="numeric" />
        </label>
        <label><span data-i18n="scan.camera">カメラ</span><select id="scan-camera"></select></label>
      </div>
      <div class="btn-row scan-actions">
        <span class="action-buttons">
          <button id="scan-start" class="iconbtn primary" disabled data-i18n-title="scan.start">
            <svg class="ic ic-fill"><use href="#i-play"/></svg></button>
          <button id="scan-stop" class="iconbtn" disabled data-i18n-title="scan.stop">
            <svg class="ic ic-fill"><use href="#i-stop"/></svg></button>
        </span>
        <span class="action-toggles">
          <label class="icon-toggle" data-i18n-title="scan.mirror"><input id="mirror-toggle" type="checkbox" /><svg class="ic"><use href="#i-mirror"/></svg></label>
          <label class="icon-toggle" data-i18n-title="scan.worldView"><input id="world-toggle" type="checkbox" /><svg class="ic"><use href="#i-cube"/></svg></label>
        </span>
        <span class="seg action-layout" id="layout-seg">
          <button type="button" data-layout="row" class="active" data-i18n-title="layout.row"><svg class="ic"><use href="#i-cols"/></svg></button>
          <button type="button" data-layout="column" data-i18n-title="layout.column"><svg class="ic"><use href="#i-rows"/></svg></button>
          <button type="button" data-layout="tabs" data-i18n-title="layout.tabs"><svg class="ic"><use href="#i-tabs"/></svg></button>
        </span>
      </div>
    </details>

    <!-- ステージ：カメラ / 検出結果 / 3D ワールド / 3D モデル を自由配置 -->
    <div class="stage" id="stage" data-layout="row">
      <div class="stage-bar" id="stage-bar" hidden>
        <div class="stage-tabs" id="stage-tabs"></div>
      </div>
      <div class="stage-panels" id="stage-panels">
        <section class="stage-panel" data-panel="camera">
          <div class="panel-bar">
            <span class="panel-title" data-i18n="panel.camera">カメラ</span>
            <button type="button" id="adjust-btn" class="mini" data-i18n-title="adj.title"><svg class="ic"><use href="#i-sliders"/></svg></button>
            <button type="button" id="static-load-btn" class="mini" data-i18n-title="scan.loadImage"><svg class="ic"><use href="#i-image"/></svg></button>
            <input id="static-file" type="file" accept="image/*" hidden />
            <span class="panel-tools">
              <button type="button" class="mini" data-move="camera:-1" data-i18n-title="panel.moveBack">◀</button>
              <button type="button" class="mini" data-move="camera:1" data-i18n-title="panel.moveFwd">▶</button>
            </span>
          </div>
          <div class="video-wrap">
            <video id="video" playsinline autoplay muted></video>
            <img id="static-img" class="static-img" hidden alt="" />
            <canvas id="overlay"></canvas>
            <canvas id="three-canvas"></canvas>
            <div id="lock-indicator" class="lock-badge" hidden></div>
            <div id="adjust-panel" class="adjust-panel" hidden>
              <div class="adj-title" data-i18n="adj.title">明るさ・コントラスト</div>
              <label class="checkbox adj-auto"><input id="auto-adjust" type="checkbox" checked /><span data-i18n="adj.auto">自動調整</span></label>
              <label class="adj-row"><span data-i18n="adj.bright">明るさ</span><input id="adj-bright" type="range" min="-100" max="100" value="0" /></label>
              <label class="adj-row"><span data-i18n="adj.contrast">コントラスト</span><input id="adj-contrast" type="range" min="50" max="300" value="100" /></label>
              <button type="button" id="adj-reset" class="mini" data-i18n="adj.reset">リセット</button>
            </div>
          </div>
        </section>
        <section class="stage-panel" data-panel="list">
          <div class="panel-bar">
            <span class="panel-title" data-i18n="scan.results">検出結果</span>
            <span id="detect-count" class="badge">0</span>
            <span class="fps-inline"><span data-i18n="scan.fps">FPS</span> <span id="fps">--</span></span>
            <span class="panel-tools">
              <button type="button" id="list-orient-btn" class="mini" data-i18n-title="scan.listToggle"><svg class="ic"><use href="#i-rows"/></svg></button>
              <button type="button" class="mini" data-move="list:-1" data-i18n-title="panel.moveBack">◀</button>
              <button type="button" class="mini" data-move="list:1" data-i18n-title="panel.moveFwd">▶</button>
            </span>
          </div>
          <div id="detect-list" class="detect-list"><p class="empty" data-i18n="scan.none">検出されていません</p></div>
        </section>
        <section class="stage-panel" data-panel="world" hidden>
          <div class="panel-bar">
            <span class="panel-title" data-i18n="scan.worldView">3D ワールドビュー</span>
            <label class="bg-pick"><span data-i18n="world.bg">背景</span>
              <select id="world-bg">
                <option value="auto" selected data-i18n="world.bgAuto">テーマに合わせる</option>
                <option value="light" data-i18n="world.bgLight">ライト</option>
                <option value="dark" data-i18n="world.bgDark">ダーク</option>
                <option value="sky" data-i18n="world.bgSky">青空</option>
                <option value="custom" data-i18n="world.bgCustom">画像を選択…</option>
              </select>
            </label>
            <input id="world-bg-file" type="file" accept="image/*" hidden />
            <span class="panel-tools">
              <button type="button" class="mini" data-move="world:-1" data-i18n-title="panel.moveBack">◀</button>
              <button type="button" class="mini" data-move="world:1" data-i18n-title="panel.moveFwd">▶</button>
            </span>
          </div>
          <div class="world-wrap">
            <canvas id="world-canvas"></canvas>
            <p class="world-scale-overlay" id="world-scale-cap"></p>
            <details class="world-cam-ctrl">
              <summary data-i18n="world.camCtrl">カメラ位置・姿勢</summary>
              <div class="world-cam-rows">
                <label class="adj-row"><span data-i18n="world.camHeight">高さ</span><input id="world-cam-height" type="range" min="-300" max="700" value="260" /></label>
                <label class="adj-row"><span data-i18n="world.camDist">距離</span><input id="world-cam-dist" type="range" min="150" max="1400" value="520" /></label>
                <div class="world-cam-btns">
                  <button type="button" id="world-reset" class="mini" data-i18n="world.reset">リセット</button>
                  <button type="button" id="world-device-btn" class="ghost-btn world-device" hidden data-i18n="scan.followDevice">デバイス姿勢に追従</button>
                </div>
              </div>
            </details>
          </div>
        </section>
        <section class="stage-panel" data-panel="model" hidden>
          <div class="panel-bar">
